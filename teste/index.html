<title>Torre de Babel — Teste de Proficiência em Inglês</title>

<style>
:root{

  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;padding-bottom:60px;overflow-x:hidden}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:0;z-index:30;background:rgba(244,246,242,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
.brand{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;margin-right:auto}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--flame2)}
.brand small{font-family:var(--body);font-weight:500;font-size:10px;color:var(--muted);text-transform:uppercase}
.stat{display:flex;align-items:center;gap:5px;font-weight:600;font-size:14px}
.stat .lab{color:var(--muted);font-weight:500;font-size:12px}
.hero{padding:28px 0 6px}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--flame2)}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(27px,7vw,42px);line-height:1.03;letter-spacing:-.03em;margin:8px 0 10px}
.hero p{color:var(--muted);max-width:56ch;font-size:15px}
.bar{margin:18px 0 6px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--e1),var(--e2),var(--e3),var(--e4),var(--e5),var(--e6));transition:width .5s}
.barlab{font-size:12px;color:var(--muted)}

.layout{display:flex;gap:20px;align-items:flex-start;margin-top:22px}
.towerCol{flex:none;width:190px}
.nodes{display:flex;flex-direction:column-reverse;gap:6px}
.node{position:relative;font-family:var(--body);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;display:flex;flex-direction:row;align-items:center;gap:10px;color:var(--ink);transition:box-shadow .2s}
.node .circle{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:13px;color:#fff}
.node .who{font-size:12px;font-weight:600;color:var(--muted);line-height:1.15}
.node.locked{background:#F0F1EE;border-color:#E8EAE5}
.node.locked .circle{background:var(--lock)!important}
.node.locked .who{color:var(--lock)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--flame),0 0 0 0 rgba(240,132,44,.35)}50%{box-shadow:0 0 0 2px var(--flame),0 0 0 7px rgba(240,132,44,0)}}
.node.current{animation:pulse 2.2s ease-in-out infinite}
.svgi{width:14px;height:14px}

.rightCol{flex:1;min-width:0}
.counters{display:flex;gap:10px;margin-bottom:14px}
.cnt{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center}
.cntlab{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.cntval{font-family:var(--disp);font-weight:800;font-size:19px}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px 26px;box-shadow:0 6px 18px rgba(27,35,31,.06)}
.who2{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card h2{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.3;margin:8px 0 16px}
.hint{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--muted);margin-bottom:10px}
.cards{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:13px 14px;cursor:pointer;font-size:15px;font-weight:500;text-align:left;font-family:var(--body);transition:.12s;width:100%;color:var(--ink)}
.opt:hover{border-color:var(--ink)}
.opt.ok{background:#E9F7F1;border-color:var(--ok)}
.opt.no{background:#FBECEB;border-color:var(--err);color:var(--err)}
.fb{font-size:13px;margin-top:10px;min-height:18px;font-weight:600}
.go{width:100%;border:none;border-radius:14px;padding:15px;cursor:pointer;font-family:var(--disp);font-weight:800;font-size:16px;color:#fff;background:var(--ink);transition:.12s;margin-top:8px}
.go:hover{filter:brightness(1.12)}.go:active{transform:scale(.98)}
.ghost{background:none;border:1px solid var(--line);border-radius:99px;padding:9px 16px;cursor:pointer;font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--ink);color:var(--ink)}
.foot{display:flex;justify-content:center;gap:10px;margin-top:26px}
.result h2{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:6px 0 8px}
.result p{color:var(--muted);font-size:15px;margin-bottom:10px}
.nextlevel{font-size:13px;color:var(--muted);margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;z-index:80;font-weight:600;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:640px){.layout{flex-direction:column}.towerCol{width:100%}.nodes{flex-direction:row-reverse;flex-wrap:wrap}.node{flex:1;min-width:90px;flex-direction:column;text-align:center}}
</style>
</head>

const FB_C = ['Certo!','Isso mesmo!','Muito bem!','Acertou!'];

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

let currentLevel=0, highestPassed=-1, consecutiveCorrect=0, consecutiveWrong=0;
let used=[[],[],[],[],[],[]], totalAsked=0, current=null;
const MAX_TOTAL = 45;

function pickQuestion(level){
  const pool=[];
  RAW[level].forEach((item,i)=>{ if(!used[level].includes(i)) pool.push(i); });
  if(!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

function checkSvg(){ return '<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>'; }
function lockSvg(){ return '<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'; }

function updateCounters(){
  const box = document.getElementById('counters');
  const regressed = currentLevel<=highestPassed;
  if(regressed){
    box.innerHTML = '<div class="cnt" style="flex:1"><span class="cntlab">Modo revisão</span><span class="cntval" style="font-size:14px">1 acerto = volta ao topo</span></div>';
  } else {
    box.innerHTML =
      '<div class="cnt"><span class="cntlab">Acertos seguidos</span><span class="cntval">'+consecutiveCorrect+'/'+THRESH[currentLevel]+'</span></div>'+
      '<div class="cnt"><span class="cntlab">Erros seguidos</span><span class="cntval">'+consecutiveWrong+'/2</span></div>';
  }
}

function renderNodes(){
  const el = document.getElementById('towerNodes');
  let html='';
  for(let i=0;i<6;i++){
    const passed = i<=highestPassed;
    const isCurrent = i===currentLevel;
    const locked = !passed && !isCurrent;
    const color = passed ? 'var('+LCOLORD[i]+')' : (isCurrent ? 'var('+LCOLOR[i]+')' : null);
    const circleStyle = color ? 'background:'+color : '';
    const inner = passed ? checkSvg() : (locked ? lockSvg() : LEVELS[i]);
    html += '<div class="node'+(locked?' locked':'')+(isCurrent?' current':'')+'">'+
      '<div class="circle" style="'+circleStyle+'">'+inner+'</div>'+
      '<div class="who">'+LEVELS[i]+'</div></div>';
  }
  el.innerHTML = html;
  document.getElementById('curLevel').textContent = LEVELS[currentLevel];
  const bf = document.getElementById('barfill');
  const pct = Math.round(((highestPassed+1)/6)*100);
  bf.style.width = pct+'%';
  document.getElementById('barlab').textContent = highestPassed>=0
    ? 'Andar '+LEVELS[highestPassed]+' conquistado. Testando '+LEVELS[currentLevel]+' agora.'
    : 'Testando o alicerce, andar '+LEVELS[currentLevel]+'.';
  updateCounters();
}

function renderQuestion(){
  const panel = document.getElementById('panel');
  const item = RAW[currentLevel][current];
  const regressed = currentLevel<=highestPassed;
  let optsHtml='';
  item.o.forEach((o,i)=>{
    optsHtml += '<button class="opt" data-i="'+i+'" onclick="answer('+i+')">'+o+'</button>';
  });
  let hint='';
  if(item.note==='presente') hint='<div class="hint">📖 Presente narrativo: a história é antiga, mas é contada no presente.</div>';
  else if(item.note==='futuro') hint='<div class="hint">🔮 Futuro dentro da própria história (relativo àquele momento).</div>';
  panel.innerHTML =
    '<div class="who2">'+(regressed?'Revisando o andar '+LEVELS[currentLevel]+' já conquistado':'Andar '+LEVELS[currentLevel])+'</div>'+
    hint+
    '<h2>'+item.q+'</h2>'+
    '<div class="cards" id="opts">'+optsHtml+'</div>'+
    '<p class="fb" id="feedback"></p>';
  renderNodes();
}

function decideNext(){
  if(totalAsked>=MAX_TOTAL){ finish(); return; }
  current = pickQuestion(currentLevel);
  if(current===null){ finish(); return; }
  renderQuestion();
}

function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2600);
}

function answer(i){
  const item = RAW[currentLevel][current];
  used[currentLevel].push(current);
  const correct = i===item.c;
  const buttons = document.querySelectorAll('#opts .opt');
  buttons.forEach(b=>{ b.onclick=null; b.style.pointerEvents='none'; });
  buttons[i].classList.add(correct?'ok':'no');
  if(!correct) buttons[item.c].classList.add('ok');
  const fb = document.getElementById('feedback');
  let leveledUp = false;
  if(correct){
    if(currentLevel<=highestPassed){
      currentLevel = highestPassed+1;
      consecutiveCorrect=0; consecutiveWrong=0;
      fb.style.color = 'var(--ok)';
      fb.textContent = 'Boa! Voltando direto para o andar '+LEVELS[currentLevel]+'.';
    } else {
      consecutiveCorrect++; consecutiveWrong=0;
      fb.style.color = 'var(--ok)';
      fb.textContent = pick(FB_C)+' '+consecutiveCorrect+'/'+THRESH[currentLevel]+' para subir.';
      if(consecutiveCorrect>=THRESH[currentLevel]){
        const passedLevel = currentLevel;
        highestPassed = passedLevel;
        consecutiveCorrect=0;
        toast('🧱 Andar '+LEVELS[passedLevel]+' construído!');
        if(passedLevel===5){
          totalAsked++;
          setTimeout(finish,900);
          return;
        }
        currentLevel = passedLevel+1;
        leveledUp = true;
      }
    }
  } else {
    consecutiveWrong++; consecutiveCorrect=0;
    fb.style.color = 'var(--err)';
    fb.textContent = pick(FB_W)+' '+consecutiveWrong+'/2 para recuar.';
    if(consecutiveWrong>=2){
      if(currentLevel>0) currentLevel--;
      consecutiveWrong=0;
      fb.textContent = 'Recuou para o andar '+LEVELS[currentLevel]+'.';
    }
  }
  updateCounters();
  totalAsked++;
  setTimeout(decideNext, leveledUp?1000:900);
}

function restart(){
  currentLevel=0; highestPassed=-1; consecutiveCorrect=0; consecutiveWrong=0;
  used=[[],[],[],[],[],[]]; totalAsked=0;
  current = pickQuestion(currentLevel);
  renderQuestion();
}

function finish(){
  currentLevel = highestPassed>=0 ? highestPassed : 0;
  renderNodes();
  const panel = document.getElementById('panel');
  const label = highestPassed>=0?LEVELS[highestPassed]:'Pré-A1';
  const desc = highestPassed>=0?LEVEL_DESC[highestPassed]:'Ainda construindo o alicerce do nível A1.';
  const nextLevel = highestPassed+1<=5?LEVELS[highestPassed+1]:null;
  panel.innerHTML =
    '<div class="result">'+
    '<div class="who2">Resultado</div>'+
    '<h2>Nível '+label+'</h2>'+
    '<p>'+desc+'</p>'+
    (nextLevel ? '<p class="nextlevel">Andar em construção: '+nextLevel+'</p>' : '')+
    '<button class="go" onclick="window.location.href=\'#oferta\'">Quero subir mais alto ↗</button>'+
    '<button class="ghost" style="width:100%;margin-top:10px" onclick="restart()">recomeçar do zero</button>'+
    '</div>';
}

current = pickQuestion(currentLevel);
renderQuestion();
</script>
</body>
</html>
